# Tag a Tracker release from a typed version, and leave a draft carrying its
# notes.
#
# Run it from Actions > Tracker tag > Run workflow, give it the tag, and it
# does the five things that otherwise happen by hand and in the wrong order:
# checks the tag is one this repository can actually release, moves the
# version to match, pushes the tag, leaves a draft release on it whose body
# is composed from the tagged version's own notes file, if one has been
# written (or, when it has not, GitHub's own generated notes under a banner
# demanding a rewrite), and starts the build workflow (tracker-release.yml)
# against that tag.
#
# The build still stays a separate workflow, dispatched with
# workflow_dispatch rather than inlined here, and it is dispatched against
# main rather than the tag this job just pushed -- see tracker-release.yml's
# own header comment for why. This workflow itself never builds, uploads or
# publishes. Publishing the draft stays a human act, and it is what fires
# notify-hub-release.yml.
#
# Ported from ForgePact's forgepact-tag.yml -- same shape, same reasoning;
# see docs/submodules/ForgePact/instructions.md and scripts/tracker-tag.mjs's
# own header comment for what each refusal guards against.
name: Tracker tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release as, e.g. v0.1.3 (or just 0.1.3)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tracker-tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      # Committing the version bump, pushing the tag, and leaving the draft
      # release.
      contents: write
      # Starting tracker-release.yml. Without it the dispatch below is a 403
      # from a job that has already pushed the tag and left the draft --
      # exactly the "tag exists, nothing is building it" state the dispatch
      # exists to avoid.
      actions: write
    steps:
      # A release is cut from main. Run from anywhere else, the bump below
      # would push a branch's tree to main and the tag would point at code
      # that was never merged.
      - name: This has to be run from main
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$BRANCH" != "main" ]; then
            echo "::error::Run this from main. It was started on '$BRANCH', whose code is not what a release should ship."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Both the bump and the tag are made by this job, and the bump step is
      # skipped when the tree already matches -- so the identity is set once
      # here rather than in whichever step happens to run.
      - name: Commit as the bot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      # Against the remote rather than the local clone, so this does not
      # depend on actions/checkout having fetched tags.
      - name: Which Tracker versions are already tagged
        id: tags
        run: |
          # pipefail because this is the answer every later check is measured
          # against, and "no tags" is not the same answer as "could not ask".
          set -o pipefail
          refs=$(git ls-remote --tags origin 'refs/tags/v*' | cut -f2 | tr '\n' ' ')
          echo "refs=$refs" >> "$GITHUB_OUTPUT"
          echo "existing: ${refs:-none}"

      - name: What the tree currently says
        id: tree
        run: |
          echo "version=$(node -e "console.log(require('./package.json').version)")" >> "$GITHUB_OUTPUT"

      # Everything after this trusts the tag, so everything that could be
      # wrong with it is decided here: the shape, whether it is taken,
      # whether it would point releases/latest at something older than a tag
      # already published, and whether it is behind the tree main already
      # holds. scripts/tracker-tag.mjs has the reasoning and the tests; a
      # refusal exits non-zero having printed nothing, so no later step has a
      # version to act on.
      #
      # The typed string reaches the shell only through env:, never
      # interpolated into a run: line.
      - name: Is this a tag we can release
        id: plan
        env:
          TAG_INPUT: ${{ inputs.tag }}
          REFS: ${{ steps.tags.outputs.refs }}
          TREE: ${{ steps.tree.outputs.version }}
        run: |
          # Captured rather than piped into $GITHUB_OUTPUT. GitHub runs this
          # as bash -e {0} with no pipefail, so a pipe would exit with tee's
          # status -- 0 -- and a refused tag would sail on into the bump, the
          # push and the tag with no version behind it.
          #
          # shellcheck disable=SC2086 -- REFS is a list of refs, and word
          # splitting is how it becomes separate arguments.
          plan=$(node scripts/tracker-tag.mjs --tag "$TAG_INPUT" --tree "$TREE" --existing $REFS)
          echo "$plan"
          echo "$plan" >> "$GITHUB_OUTPUT"

      # tracker-tag.mjs already refused a tag that exists, but a draft
      # release can be sitting on a tag that was never pushed -- a draft does
      # not create its tag -- so it is invisible both to that check and to
      # git. Last of the read-only checks, and deliberately still ahead of
      # the rewrite below: running it afterwards would mean the bump was
      # committed and pushed before the draft was discovered, leaving main
      # claiming a version with no release and no tag behind it.
      - name: This version has no release yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          existing=$(gh api "repos/$REPO/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"$TAG\")] | length")
          echo "releases already on $TAG: $existing"
          if [ "$existing" != "0" ]; then
            echo "::error::$TAG already has $existing release(s), including drafts. Delete them before this version can be tagged."
            exit 1
          fi

      # Called unconditionally, before any write, so the YAML has no branch
      # on whether the tagged version's own notes file exists -- that
      # decision belongs entirely to scripts/tracker-tag.mjs, which has tests
      # for it. This step creates nothing and costs only a rerun if it
      # fails; the composition below ignores this generated text whenever
      # the top file exists.
      - name: Compose the release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
          PREVIOUS: ${{ steps.plan.outputs.previous }}
          SHA: ${{ github.sha }}
        run: |
          extra=()
          if [ -n "$PREVIOUS" ]; then
            extra=(-f "previous_tag_name=$PREVIOUS")
          fi
          generated=$(gh api -X POST "repos/$REPO/releases/generate-notes" \
            -f tag_name="$TAG" -f target_commitish="$SHA" \
            "${extra[@]}" --jq .body)
          printf '%s' "$generated" > "$RUNNER_TEMP/generated.md"

          notes=$(node scripts/tracker-tag.mjs --compose-notes \
            --version "$VERSION" --previous "$PREVIOUS" \
            --generated "$RUNNER_TEMP/generated.md" \
            --out "$RUNNER_TEMP/release-notes.md")
          echo "$notes"
          echo "$notes" >> "$GITHUB_OUTPUT"

      # Only when the tree says something else. set-version.mjs refuses to
      # write a tree whose sites already disagree, so a half-bumped main
      # stops here rather than being tagged.
      - name: Move the version to match the tag
        if: steps.plan.outputs.bump == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          node scripts/set-version.mjs "$VERSION"
          git commit --all --message "Cut $VERSION"
          # Before the tag, deliberately. If someone else's merge landed
          # while this ran, the push is rejected and the job fails having
          # created nothing -- rather than leaving a tag on a commit main
          # never got.
          git push origin HEAD:main

      # What the tag points at has to agree with the tag.
      - name: Version fields agree
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: node scripts/set-version.mjs --check --expect "$VERSION"

      - name: Tag it
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          git tag -a "$TAG" -m "HS Offline Tracker $VERSION"
          git push origin "refs/tags/$TAG"

      # A tag exists with no release if this step fails -- the same state a
      # hand-made tag leaves, and it is recovered by creating the release by
      # hand from the composed notes above. No retry machinery.
      - name: Leave a draft release carrying the notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          gh release create "$TAG" --draft --verify-tag --title "HS Offline Tracker $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"

      # Dispatched against main, never against the tag this job just pushed:
      # a fix made to the build workflow could otherwise never apply to an
      # already-tagged version. If this dispatch fails, the draft exists
      # with no build behind it -- recovery is running "Tracker release" by
      # hand with the same tag.
      - name: Start the build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          gh workflow run tracker-release.yml --ref main -f tag="$TAG" -f dry_run=false
          echo "dispatched tracker-release.yml for $TAG"

      - name: Say what still needs a human
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          BUMPED: ${{ steps.plan.outputs.bump }}
          SOURCE: ${{ steps.notes.outputs.source }}
          VERSIONS: ${{ steps.notes.outputs.versions }}
        run: |
          {
            echo "### Tagged $TAG"
            echo
            if [ "$BUMPED" = "true" ]; then
              echo "The version was moved to match, and that bump is on \`main\`."
              echo
              echo "This commit was made by github-actions[bot], so it does not fire"
              echo "notify-hub.yml; the hub's submodule-pointer bump PR waits for the"
              echo "next human merge to \`main\`."
            else
              echo "\`main\` was already at this version; nothing was rewritten."
            fi
            echo
            echo "Notes source: \`$SOURCE\` (versions: $VERSIONS)."
            if [ "$SOURCE" = "generated" ] || [ "$SOURCE" = "mixed" ]; then
              echo
              echo "**Rewrite the generated section for players before publishing** --"
              echo "it is GitHub's own pull-request-title text, not player language."
            fi
            echo
            echo "\"Tracker release\" is building it now against this tag. What it"
            echo "leaves behind is still only a draft's assets -- nothing is published"
            echo "yet."
            echo
            echo "Remaining steps, all manual:"
            echo "1. Wait for the Tracker release run to finish."
            echo "2. Download the zip from the draft and run the launch gate (module"
            echo "   guide, \"CI build launch gate\")."
            echo "3. Review the composed body, and rewrite any generated section."
            echo "4. Publish. That fires notify-hub-release.yml."
          } >> "$GITHUB_STEP_SUMMARY"
